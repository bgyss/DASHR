[package]
name = "dashr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT-0"
description = "Native Rust/wgpu port of Tom Forsyth's DASHR research demo"

[dependencies]
anyhow = "=1.0.104"
bytemuck = { version = "=1.25.2", features = ["derive"] }
clap = { version = "=4.6.7", features = ["derive"] }
glam = { version = "=0.32.1", features = ["serde"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
pollster = "=1.0.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
wgpu = "=30.0.1"
winit = "=0.30.13"

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[profile.release]
lto = "thin"

[build-dependencies]
serde_json = "=1.0.149"
sha2 = "=0.10.9"
